<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7C4DFF"><title>ખર્ચ વહેંચણી / Bill Splitter</title>
<style>:root{--c:#7C4DFF;--bg:#f5f6f8;--ink:#1b1b1f;--mut:#6b6b76}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Gujarati",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
header{background:var(--c);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0}header h1{margin:0;font-size:19px;flex:1}header button{background:#fff3;border:0;color:#fff;padding:8px 12px;border-radius:10px}
main{max-width:640px;margin:0 auto;padding:14px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
input,select{width:100%;padding:11px;border:1px solid #d8dbe0;border-radius:10px;font-size:16px;margin:5px 0;background:#fff;color:var(--ink)}.btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:16px;font-weight:700;margin-top:6px}.btn.g{background:#e8eaee;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.muted{color:var(--mut);font-size:13px}.big{font-size:18px;font-weight:700}.x{background:none;border:0;color:#c33;font-size:18px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:right;border-bottom:1px solid #eee}th:first-child,td:first-child{text-align:left}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:#eef;font-size:12px;margin:2px}.ok{color:#1E9E63}.bad{color:#D64545}.bar{height:10px;border-radius:6px;background:#e8eaee;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid #d8dbe0;background:#fff;font-size:14px}.dot.on{background:var(--c);color:#fff;border-color:var(--c)}</style></head><body>
<header><h1 id="ttl"></h1><button id="lang"></button></header><main id="m"></main><script>
var gu=localStorage.getItem("lang_split")!=="en";function $(s){return document.querySelector(s)}function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstChild}function t(k){return T[k]?T[k][gu?0:1]:k}
function inr(n){return "₹"+Math.round(n).toLocaleString("en-IN")}
$("#lang").onclick=function(){gu=!gu;localStorage.setItem("lang_split",gu?"gu":"en");render()};

var T={ttl:["ખર્ચ વહેંચણી","Bill Splitter"],people:["સભ્યો","People"],add:["+ ઉમેરો","+ Add"],pn:["નામ","Name"],exp:["ખર્ચ ઉમેરો","Add expense"],what:["શેના માટે","What for"],amt:["રકમ (₹)","Amount (₹)"],paid:["કોણે ચૂકવ્યા","Paid by"],save:["સાચવો","Save"],list:["ખર્ચ","Expenses"],settle:["કોણે કોને આપવા","Who pays whom"],even:["બધું બરાબર, કોઈને આપવાનું નથી","All settled, nobody owes anything"],total:["કુલ ખર્ચ","Total spent"],share:["દરેકનો ભાગ","Each share"],reset:["બધું કાઢી નાખો","Clear all"],pays:["આપે","pays"],copy:["WhatsApp માટે કૉપી","Copy for WhatsApp"],need:["પહેલા ઓછામાં ઓછા 2 સભ્યો ઉમેરો","Add at least 2 people first"],done:["કૉપી થયું","Copied"],sure:["બધું કાઢી નાખવું છે?","Clear everything?"]};
var S;try{S=JSON.parse(localStorage.getItem("split_v1"))}catch(e){}S=S||{people:[],exp:[]};function save(){localStorage.setItem("split_v1",JSON.stringify(S))}
function balances(){var b={};S.people.forEach(function(p){b[p]=0});var tot=0;S.exp.forEach(function(e){tot+=e.amt;b[e.by]=(b[e.by]||0)+e.amt;var sh=e.amt/S.people.length;S.people.forEach(function(p){b[p]-=sh})});return{b:b,tot:tot}}
function settle(b){var d=[],c=[];Object.keys(b).forEach(function(p){if(b[p]<-0.5)d.push([p,-b[p]]);else if(b[p]>0.5)c.push([p,b[p]])});var out=[];d.sort(function(x,y){return y[1]-x[1]});c.sort(function(x,y){return y[1]-x[1]});var i=0,j=0;while(i<d.length&&j<c.length){var x=Math.min(d[i][1],c[j][1]);out.push([d[i][0],c[j][0],x]);d[i][1]-=x;c[j][1]-=x;if(d[i][1]<0.5)i++;if(c[j][1]<0.5)j++}return out}
function render(){$("#ttl").textContent=t("ttl");$("#lang").textContent=gu?"English":"ગુજરાતી";var m=$("#m");m.innerHTML="";
 var c=el('<div class="card"><div class="big">'+t("people")+'</div><div id="pl"></div><div class="row"><input id="pn" class="grow" placeholder="'+t("pn")+'"><button class="btn" id="pa" style="width:auto;padding:12px 16px">'+t("add")+'</button></div></div>');
 S.people.forEach(function(p,i){var s=el('<span class="pill">'+esc(p)+' <button class="x" style="font-size:13px">✕</button></span>');s.querySelector("button").onclick=function(){if(S.exp.some(function(e){return e.by===p}))return;S.people.splice(i,1);save();render()};c.querySelector("#pl").appendChild(s)});
 c.querySelector("#pa").onclick=function(){var v=c.querySelector("#pn").value.trim();if(v&&S.people.indexOf(v)<0){S.people.push(v);save();render()}};m.appendChild(c);
 if(S.people.length<2){m.appendChild(el('<div class="muted" style="text-align:center">'+t("need")+'</div>'));return}
 var f=el('<div class="card"><div class="big">'+t("exp")+'</div><input id="w" placeholder="'+t("what")+'"><input id="a" type="number" inputmode="decimal" placeholder="'+t("amt")+'"><div class="muted">'+t("paid")+'</div><select id="by">'+S.people.map(function(p){return"<option>"+esc(p)+"</option>"}).join("")+'</select><button class="btn" id="sv">'+t("save")+'</button></div>');
 f.querySelector("#sv").onclick=function(){var a=parseFloat(f.querySelector("#a").value);if(!(a>0))return;S.exp.push({id:Date.now(),w:f.querySelector("#w").value.trim(),amt:a,by:f.querySelector("#by").value});save();render()};m.appendChild(f);
 var r=balances();var res=el('<div class="card"><div class="row"><div class="grow"><div class="muted">'+t("total")+'</div><div class="big">'+inr(r.tot)+'</div></div><div class="grow"><div class="muted">'+t("share")+'</div><div class="big">'+inr(r.tot/S.people.length)+'</div></div></div></div>');m.appendChild(res);
 var st=settle(r.b),sc=el('<div class="card"><div class="big">'+t("settle")+'</div></div>');
 if(!st.length)sc.appendChild(el('<div class="ok" style="margin-top:8px">'+t("even")+'</div>'));
 var txt=[];st.forEach(function(s){var line=s[0]+" → "+s[1]+": "+inr(s[2]);txt.push(line);sc.appendChild(el('<div style="margin-top:8px"><b>'+esc(s[0])+'</b> '+t("pays")+' <b>'+esc(s[1])+'</b> <span class="bad">'+inr(s[2])+'</span></div>'))});
 if(st.length){var cb=el('<button class="btn g">'+t("copy")+'</button>');cb.onclick=function(){var s=t("ttl")+"\n"+txt.join("\n");(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){alert(t("done"))},function(){prompt("",s)})};sc.appendChild(cb)}
 m.appendChild(sc);
 var l=el('<div class="card"><div class="big">'+t("list")+'</div></div>');S.exp.slice().reverse().forEach(function(e){var r=el('<div class="row" style="margin-top:8px"><div class="grow">'+esc(e.w||"-")+'<div class="muted">'+esc(e.by)+'</div></div><b>'+inr(e.amt)+'</b><button class="x">✕</button></div>');r.querySelector("button").onclick=function(){S.exp=S.exp.filter(function(x){return x.id!==e.id});save();render()};l.appendChild(r)});
 var rs=el('<button class="btn g">'+t("reset")+'</button>');rs.onclick=function(){if(confirm(t("sure"))){S={people:[],exp:[]};save();render()}};l.appendChild(rs);m.appendChild(l)}
render();

</script></body></html>
